<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Italianno&amp;family=Cinzel:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;display=swap');
      
      .brand-script {
        font-family: 'Italianno', 'Playfair Display', cursive;
        font-size: 170px;
        font-style: italic;
        font-weight: 500;
        fill: #0A0A0A;
        text-anchor: middle;
      }
      .brand-sub {
        font-family: 'Cinzel', 'Trajan Pro', serif;
        font-size: 24px;
        letter-spacing: 24px;
        font-weight: 700;
        fill: #111111;
        text-anchor: middle;
      }
      .tagline {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 15px;
        letter-spacing: 10px;
        font-weight: 500;
        fill: #4B5563;
        text-anchor: middle;
      }
      .domain-footer {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 13px;
        letter-spacing: 6px;
        font-weight: 500;
        fill: #9CA3AF;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Pure Minimalist White Background -->
  <rect width="1200" height="630" fill="#FFFFFF" />

  <!-- Subtle Minimalist Hairline Frame with Generous Margins -->
  <rect x="48" y="48" width="1104" height="534" rx="4" fill="none" stroke="#E5E7EB" stroke-width="1" />

  <!-- Center Content with Generous Whitespace -->
  <!-- Cursive Zyper -->
  <text x="600" y="260" class="brand-script">Zyper</text>

  <!-- VENTURES Subtitle -->
  <text x="612" y="360" class="brand-sub">VENTURES</text>

  <!-- Minimal Hairline Accent -->
  <line x1="460" y1="410" x2="540" y2="410" stroke="#D1D5DB" stroke-width="1" />
  <circle cx="600" cy="410" r="2.5" fill="#111111" />
  <line x1="660" y1="410" x2="740" y2="410" stroke="#D1D5DB" stroke-width="1" />

  <!-- Core Pillars -->
  <text x="605" y="465" class="tagline">REAL ESTATE · CONSTRUCTION · BEVERAGES</text>

  <!-- Domain -->
  <text x="600" y="525" class="domain-footer">WWW.ZYPER.CO.IN</text>
</svg>
